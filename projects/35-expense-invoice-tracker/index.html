<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense & Invoice Tracker — The Bench</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="pegboard">
  <a class="bench-nav glass" href="../../index.html">&larr; The Bench</a>
  <main class="container tool-shell">
    <header class="tool-head center">
      <span class="eyebrow">Tool #35 · Business</span>
      <h1>Expense & Invoice Tracker</h1>
      <p>A small business dashboard: what you've billed, what's been paid, and what you've spent.</p>
    </header>

    <div class="summary-grid">
      <div class="glass summary-box"><span class="s-label">Invoiced</span><span class="s-value" id="sum-invoiced">₹0</span></div>
      <div class="glass summary-box"><span class="s-label">Collected</span><span class="s-value teal" id="sum-collected">₹0</span></div>
      <div class="glass summary-box"><span class="s-label">Pending</span><span class="s-value amber" id="sum-pending">₹0</span></div>
      <div class="glass summary-box"><span class="s-label">Expenses</span><span class="s-value danger" id="sum-expenses">₹0</span></div>
      <div class="glass summary-box"><span class="s-label">Net</span><span class="s-value" id="sum-net">₹0</span></div>
    </div>

    <div class="glass chart-card">
      <strong>Last 6 months — revenue vs. expenses</strong>
      <canvas id="trend-canvas" width="700" height="220"></canvas>
    </div>

    <div class="tab-row">
      <button class="chip is-active" data-tab="invoices">Invoices</button>
      <button class="chip" data-tab="expenses">Expenses</button>
    </div>

    <div class="glass panel" id="invoices-panel">
      <div class="entry-form">
        <input type="text" id="inv-client" placeholder="Client name">
        <input type="number" id="inv-amount" placeholder="Amount">
        <select id="inv-status"><option value="pending">Pending</option><option value="paid">Paid</option><option value="overdue">Overdue</option></select>
        <button class="btn btn-primary" id="inv-add">Add invoice</button>
      </div>
      <ul class="entry-list" id="invoices-list"></ul>
    </div>

    <div class="glass panel hidden" id="expenses-panel">
      <div class="entry-form">
        <input type="text" id="exp-desc" placeholder="Description">
        <input type="number" id="exp-amount" placeholder="Amount">
        <select id="exp-category"><option>Software</option><option>Hardware</option><option>Marketing</option><option>Travel</option><option>Other</option></select>
        <button class="btn btn-primary" id="exp-add">Add expense</button>
      </div>
      <ul class="entry-list" id="expenses-list"></ul>
    </div>
  </main>
  <script src="../../assets/js/storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
