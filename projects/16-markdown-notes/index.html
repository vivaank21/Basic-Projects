<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Bench — The Bench</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="pegboard">
  <a class="bench-nav glass" href="../../index.html">&larr; The Bench</a>
  <main class="container tool-shell wide">
    <header class="tool-head center">
      <span class="eyebrow">Tool #16 · Productivity</span>
      <h1>Markdown Bench</h1>
      <p>Write on the left, preview on the right. Notes autosave and tag by topic.</p>
    </header>

    <div class="notes-layout">
      <aside class="glass notes-sidebar">
        <button class="btn btn-primary" id="new-note" style="width:100%; margin-bottom:14px;">+ New note</button>
        <input type="text" id="notes-search" placeholder="Search notes…">
        <ul id="notes-list"></ul>
      </aside>

      <section class="editor-pane">
        <div class="editor-top">
          <input type="text" id="note-title" placeholder="Untitled note">
          <input type="text" id="note-tags" placeholder="tags, comma, separated">
          <button class="btn btn-ghost" id="export-note">Export .md</button>
          <button class="btn btn-danger" id="delete-note">Delete</button>
        </div>
        <div class="editor-split">
          <textarea id="note-body" placeholder="# Start writing in Markdown…"></textarea>
          <div class="preview" id="note-preview"></div>
        </div>
        <div class="editor-foot">
          <span id="word-count">0 words</span>
          <span id="save-status"></span>
        </div>
      </section>
    </div>
  </main>
  <script src="../../assets/js/storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
