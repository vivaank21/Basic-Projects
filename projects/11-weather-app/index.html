<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Bench — The Bench</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/loader.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="pegboard">
  <a class="bench-nav glass" href="../../index.html">&larr; The Bench</a>
  <main class="container tool-shell">
    <header class="tool-head center">
      <span class="eyebrow">Tool #11 · Data</span>
      <h1>Weather Bench</h1>
      <p>Search any city for live conditions and a 5-day outlook. Data from Open-Meteo.</p>
    </header>

    <div class="search-row">
      <input type="text" id="city-input" placeholder="Search for a city…">
      <button class="btn btn-primary" id="city-search">Search</button>
    </div>
    <div class="favorites-row" id="favorites-row"></div>

    <div id="weather-loading" class="hidden center" style="padding:40px 0;">
      <div class="loader-bit" style="margin:0 auto;"></div>
    </div>

    <div class="glass current-card hidden" id="current-card">
      <div class="current-top">
        <div>
          <h2 id="current-city">—</h2>
          <p id="current-desc">—</p>
        </div>
        <button class="btn btn-ghost" id="fav-btn">☆ Save</button>
      </div>
      <div class="current-temp" id="current-temp">--°</div>
      <div class="current-stats">
        <span>Feels: <strong id="stat-feels">--</strong></span>
        <span>Wind: <strong id="stat-wind">--</strong></span>
        <span>Humidity: <strong id="stat-humidity">--</strong></span>
      </div>
    </div>

    <div class="forecast-grid" id="forecast-grid"></div>
    <p class="weather-empty hidden" id="weather-empty">Search a city to see the forecast.</p>
  </main>
  <script src="../../assets/js/storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
