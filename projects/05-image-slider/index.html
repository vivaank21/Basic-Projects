<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Slider — The Bench</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="pegboard">
  <a class="bench-nav glass" href="../../index.html">&larr; The Bench</a>
  <main class="container tool-shell">
    <header class="tool-head center">
      <span class="eyebrow">Tool #05 · Media</span>
      <h1>Hero Slider</h1>
      <p>Touch-swipe on mobile, arrows on desktop, autoplay with pause on hover.</p>
    </header>

    <div class="glass slider" id="slider">
      <div class="slider-track" id="slider-track"></div>
      <button class="slider-arrow left" id="arrow-prev" aria-label="Previous slide">‹</button>
      <button class="slider-arrow right" id="arrow-next" aria-label="Next slide">›</button>
      <div class="slider-dots" id="slider-dots"></div>
      <button class="slider-play" id="slider-play" aria-label="Pause autoplay">⏸</button>
    </div>
    <div class="slider-thumbs" id="slider-thumbs"></div>
  </main>
  <script src="../../assets/js/storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
